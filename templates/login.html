<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Mi Web 🐍
        </div>

        <div class="nav-links">
            <a href="/">🏠 Inicio</a>
            <a href="/login">🔐 Iniciar sesión</a>
        </div>

    </nav>


    <main class="contenido">

        <div class="login-card">

            <h1>Iniciar sesión</h1>

            <p>Ingresá tus datos para continuar.</p>

            {% if error %}
                <div class="error-mensaje">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Tu usuario"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Tu contraseña"
                    required
                >


                <button type="submit">
                    Ingresar
                </button>

            </form>

        </div>

    </main>

</body>

</html>
