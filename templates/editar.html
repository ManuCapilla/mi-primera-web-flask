<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar usuario</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Editar usuario</h1>

    <form method="POST">

        <p>Nuevo nombre:</p>

        <input
            type="text"
            name="nombre"
            value="{{ usuario['nombre'] }}"
            required
        >

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <br>

    <a href="/usuarios">
        ← Volver a usuarios
    </a>

</body>

</html>
